name: Javadoc

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions needed to deploy to GitHub Pages from Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one Pages deployment at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Javadoc
    runs-on: ubuntu-latest
    # Bound every job: with an Actions concurrency of 20 across the family, a
    # wedged job is a slot everyone else waits on. Javadoc generation is ~17 s,
    # so 10 min fails fast without ever cutting a healthy run short.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Generates HTML into target/reports/apidocs (bench package excluded).
      - name: Generate Javadoc
        run: mvn -B -DskipTests javadoc:javadoc

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          # Auto-enable Pages (Actions source) so no manual repo setting is needed.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/reports/apidocs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # ~11 s observed; the Pages deployment is the only step.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
